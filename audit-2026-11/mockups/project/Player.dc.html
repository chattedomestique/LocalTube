<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Player controls</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width:1200px;height:675px;box-sizing:border-box;position:relative;overflow:hidden;background:linear-gradient(180deg,#8FD3F4 0%,#CDEBFA 48%,#FFF3C4 72%);color:#fff;font-family:ui-rounded,'Nunito',system-ui,sans-serif">

  <!-- stand-in for the video frame: a bright scene, the hardest case for overlay contrast -->
  <div aria-hidden="true" style="position:absolute;left:0;right:0;top:0;bottom:0;overflow:hidden">
    <div style="position:absolute;right:210px;top:96px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,#FFF0A6 0%,#FFD34D 70%)"></div>
    <div style="position:absolute;left:120px;top:120px;width:170px;height:56px;border-radius:999px;background:#FFFFFF;opacity:.95"></div>
    <div style="position:absolute;left:160px;top:98px;width:90px;height:60px;border-radius:50%;background:#FFFFFF;opacity:.95"></div>
    <div style="position:absolute;left:-12%;width:68%;bottom:-70px;height:300px;border-radius:50%;background:linear-gradient(#8ED67F,#52A85F)"></div>
    <div style="position:absolute;left:34%;width:84%;bottom:-120px;height:300px;border-radius:50%;background:linear-gradient(#6FC06A,#3F9150)"></div>
  </div>

  <!-- scrims: top, bottom, and a soft radial one behind the centre controls -->
  <div aria-hidden="true" style="position:absolute;left:0;right:0;top:0;height:190px;background:linear-gradient(to bottom,rgba(10,8,7,.72),rgba(10,8,7,0))"></div>
  <div aria-hidden="true" style="position:absolute;left:0;right:0;bottom:0;height:230px;background:linear-gradient(to top,rgba(10,8,7,.82) 0%,rgba(10,8,7,.62) 55%,rgba(10,8,7,0) 100%)"></div>
  <div aria-hidden="true" style="position:absolute;left:50%;top:50%;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;background:radial-gradient(circle,rgba(10,8,7,.5) 0%,rgba(10,8,7,0) 68%)"></div>

  <!-- top bar -->
  <div style="position:absolute;left:48px;right:48px;top:32px;display:flex;align-items:flex-start;justify-content:space-between;gap:24px">
    <div style="display:flex;align-items:center;gap:20px;min-width:0">
      <button type="button" style="flex:none;box-sizing:border-box;height:44px;display:flex;align-items:center;gap:8px;padding:0 20px 0 14px;border-radius:10px;background:rgba(17,15,14,.62);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:16px;font-weight:600;line-height:1;letter-spacing:0.005em;cursor:pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Back
      </button>
      <h1 style="margin:0;max-width:600px;font-size:22px;font-weight:700;line-height:1.2;letter-spacing:-0.005em;text-shadow:0 1px 8px rgba(0,0,0,.6);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden">Wheels on the Bus | Sing Along Nursery Rhymes for Toddlers</h1>
    </div>
    <div style="flex:none;display:flex;align-items:center;gap:12px">
      <button type="button" style="box-sizing:border-box;height:44px;padding:0 20px;border-radius:10px;background:rgba(17,15,14,.62);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:16px;font-weight:600;line-height:1;cursor:pointer">Autoplay: Off</button>
      <button type="button" aria-label="Loop: off" aria-pressed="false" style="box-sizing:border-box;width:44px;height:44px;border-radius:10px;background:rgba(17,15,14,.62);border:1px solid rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3l3 3-3 3M4 11V9a3 3 0 0 1 3-3h13M7 21l-3-3 3-3M20 13v2a3 3 0 0 1-3 3H4"/></svg>
      </button>
    </div>
  </div>

  <!-- centre transport: dark-ink discs, large glyphs, a legible "10" -->
  <div style="position:absolute;left:0;right:0;top:50%;margin-top:-40px;display:flex;align-items:center;justify-content:center;gap:40px">
    <button type="button" aria-label="Back 10 seconds" style="box-sizing:border-box;width:64px;height:64px;border-radius:50%;background:rgba(17,15,14,.62);border:1px solid rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer">
      <svg width="32" height="32" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 5.5V2L9 7l5 5V8.6c3.5.5 6.2 3.5 6.2 7.2 0 4-3.2 7.2-7.2 7.2S5.8 19.8 5.8 15.8"/><text x="14" y="21" text-anchor="middle" font-size="10.5" font-weight="800" fill="currentColor" stroke="none" font-family="Nunito,system-ui,sans-serif">10</text></svg>
    </button>
    <button type="button" aria-label="Pause" style="box-sizing:border-box;width:80px;height:80px;border-radius:50%;background:rgba(17,15,14,.62);border:1px solid rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 0 3px #110F0E,0 0 0 6px #FFF4DD">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5.5" y="4" width="4.5" height="16" rx="1.5"/><rect x="14" y="4" width="4.5" height="16" rx="1.5"/></svg>
    </button>
    <button type="button" aria-label="Forward 10 seconds" style="box-sizing:border-box;width:64px;height:64px;border-radius:50%;background:rgba(17,15,14,.62);border:1px solid rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer">
      <svg width="32" height="32" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 5.5V2l5 5-5 5V8.6c-3.5.5-6.2 3.5-6.2 7.2 0 4 3.2 7.2 7.2 7.2s7.2-3.2 7.2-7.2"/><text x="14" y="21" text-anchor="middle" font-size="10.5" font-weight="800" fill="currentColor" stroke="none" font-family="Nunito,system-ui,sans-serif">10</text></svg>
    </button>
  </div>

  <!-- bottom bar: one dark pill holds timecodes and the scrub bar, so it reads over any frame -->
  <div style="position:absolute;left:48px;right:48px;bottom:36px;box-sizing:border-box;height:64px;display:flex;align-items:center;gap:18px;padding:0 9px 0 28px;border-radius:20px;background:rgba(17,15,14,.62);border:1px solid rgba(255,255,255,.18)">
    <span style="flex:none;font-size:18px;font-weight:700;letter-spacing:0.01em;font-variant-numeric:tabular-nums">5:12</span>
    <div role="slider" aria-label="Playback position" aria-valuemin="0" aria-valuemax="845" aria-valuenow="312" tabindex="0" style="position:relative;flex-grow:1;height:8px;border-radius:999px;background:rgba(255,255,255,.42);box-shadow:0 0 0 1px rgba(0,0,0,.35)">
      <div style="width:37%;height:100%;border-radius:999px;background:#B79CFF"></div>
      <div style="position:absolute;left:37%;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.4)"></div>
    </div>
    <span style="flex:none;font-size:18px;font-weight:700;letter-spacing:0.01em;font-variant-numeric:tabular-nums">14:05</span>
    <button type="button" aria-label="Volume" style="flex:none;box-sizing:border-box;width:44px;height:44px;border-radius:10px;background:transparent;border:0;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
    </button>
    <button type="button" aria-label="Sleep timer" style="flex:none;box-sizing:border-box;width:44px;height:44px;border-radius:10px;background:transparent;border:0;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":675}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
