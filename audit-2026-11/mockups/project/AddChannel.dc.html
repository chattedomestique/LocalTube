<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add a channel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width:1200px;height:675px;box-sizing:border-box;position:relative;overflow:hidden;background:#110F0E;color:#F3EDE4;font-family:ui-rounded,'Nunito',system-ui,sans-serif">

  <!-- the library behind the dialog, dimmed -->
  <div aria-hidden="true" style="position:absolute;left:0;right:0;top:0;bottom:0">
    <div style="height:72px;background:#1A1715;border-bottom:1px solid rgba(255,240,225,.12)"></div>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;padding:120px 40px 0">
      <div style="height:165px;border-radius:18px;background:linear-gradient(135deg,#1F6F5A,#7ED6A5 60%,#F3E7A1)"></div>
      <div style="height:165px;border-radius:18px;background:linear-gradient(135deg,#B3472F,#F2994A)"></div>
      <div style="height:165px;border-radius:18px;background:linear-gradient(135deg,#6A4FD1,#E56BB0)"></div>
      <div style="height:165px;border-radius:18px;background:linear-gradient(135deg,#1F5F99,#6FD0F2)"></div>
    </div>
  </div>
  <div aria-hidden="true" style="position:absolute;left:0;right:0;top:0;bottom:0;background:rgba(10,8,7,.72);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="add-title" style="position:absolute;left:50%;top:50%;width:620px;transform:translate(-50%,-50%);box-sizing:border-box;padding:24px 28px;border-radius:26px;background:#2E2925;border:1px solid rgba(255,240,225,.12);box-shadow:0 20px 48px rgba(0,0,0,.55),0 6px 14px rgba(0,0,0,.4)">

    <div style="display:flex;align-items:center;justify-content:space-between;height:44px">
      <h2 id="add-title" style="margin:0;font-size:22px;font-weight:700;line-height:1.2;letter-spacing:-0.005em">Add a channel</h2>
      <button type="button" aria-label="Close" style="box-sizing:border-box;width:44px;height:44px;border-radius:50%;background:transparent;border:0;color:#C2B8AC;display:flex;align-items:center;justify-content:center;cursor:pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div style="margin-top:14px">
      <label for="yt-link" style="display:block;font-size:16px;font-weight:600;letter-spacing:0.005em;line-height:20px;margin-bottom:6px">YouTube link</label>
      <div style="position:relative">
        <input id="yt-link" type="text" value="youtube.com/@naturekidsdaily" style="box-sizing:border-box;width:100%;height:44px;padding:0 52px 0 20px;border-radius:999px;background:#231F1C;border:1px solid #7A6F64;color:#F3EDE4;font:inherit;font-size:16px;font-weight:500">
        <span style="position:absolute;right:16px;top:50%;margin-top:-10px;display:flex;color:#6EDBA5">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
        </span>
      </div>
    </div>

    <div style="margin-top:12px;display:flex;align-items:center;gap:14px;padding:12px;border-radius:18px;background:#231F1C;border:1px solid rgba(255,240,225,.12)">
      <span style="flex:none;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#1F6F5A,#7ED6A5 60%,#F3E7A1)"></span>
      <span style="flex-grow:1">
        <span style="display:block;font-size:18px;font-weight:600;line-height:1.25">Nature Kids Daily</span>
        <span style="display:block;margin-top:2px;font-size:14px;font-weight:500;color:#C2B8AC">1,284 videos · about 86 GB at 1080p</span>
      </span>
      <span style="box-sizing:border-box;display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:999px;background:rgba(110,219,165,.14);color:#6EDBA5;font-size:14px;font-weight:600;line-height:1">Found it</span>
    </div>

    <fieldset style="margin:16px 0 0;padding:0;border:0;min-width:0">
      <legend style="padding:0;font-size:16px;font-weight:600;letter-spacing:0.005em;line-height:20px;margin-bottom:8px">What should we download?</legend>
      <div style="display:flex;flex-direction:column;gap:6px">
        <label style="display:flex;align-items:center;gap:14px;padding:5px 14px;border-radius:12px;background:rgba(183,156,255,.16);border:1px solid rgba(183,156,255,.45);cursor:pointer">
          <input type="radio" name="scope" checked style="width:20px;height:20px;margin:0;accent-color:#B79CFF">
          <span>
            <span style="display:block;font-size:16px;font-weight:600;line-height:20px">The latest 25 videos</span>
            <span style="display:block;font-size:14px;font-weight:500;line-height:18px;color:#C2B8AC">About 1.7 GB. A good way to try it out.</span>
          </span>
        </label>
        <label style="display:flex;align-items:center;gap:14px;padding:5px 14px;border-radius:12px;background:transparent;border:1px solid rgba(255,240,225,.2);cursor:pointer">
          <input type="radio" name="scope" style="width:20px;height:20px;margin:0;accent-color:#B79CFF">
          <span>
            <span style="display:block;font-size:16px;font-weight:600;line-height:20px">New uploads only</span>
            <span style="display:block;font-size:14px;font-weight:500;line-height:18px;color:#C2B8AC">Starts empty and adds videos as they're posted.</span>
          </span>
        </label>
        <label style="display:flex;align-items:center;gap:14px;padding:5px 14px;border-radius:12px;background:transparent;border:1px solid rgba(255,240,225,.2);cursor:pointer">
          <input type="radio" name="scope" style="width:20px;height:20px;margin:0;accent-color:#B79CFF">
          <span>
            <span style="display:block;font-size:16px;font-weight:600;line-height:20px">Everything</span>
            <span style="display:block;font-size:14px;font-weight:500;line-height:18px;color:#C2B8AC">1,284 videos, about 86 GB. 412 GB free on this drive.</span>
          </span>
        </label>
      </div>
    </fieldset>

    <fieldset style="margin:16px 0 0;padding:0;border:0;min-width:0">
      <legend style="padding:0;font-size:16px;font-weight:600;letter-spacing:0.005em;line-height:20px;margin-bottom:8px">Show it to</legend>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <label style="box-sizing:border-box;display:flex;align-items:center;gap:10px;height:44px;padding:0 14px 0 5px;border-radius:999px;background:rgba(183,156,255,.16);border:1px solid rgba(183,156,255,.45);font-size:16px;font-weight:600;line-height:1;cursor:pointer">
          <input type="checkbox" checked style="width:20px;height:20px;margin:0;accent-color:#B79CFF;order:3">
          <span style="width:32px;height:32px;border-radius:50%;background:#FF8A80"></span>Maya
        </label>
        <label style="box-sizing:border-box;display:flex;align-items:center;gap:10px;height:44px;padding:0 14px 0 5px;border-radius:999px;background:rgba(183,156,255,.16);border:1px solid rgba(183,156,255,.45);font-size:16px;font-weight:600;line-height:1;cursor:pointer">
          <input type="checkbox" checked style="width:20px;height:20px;margin:0;accent-color:#B79CFF;order:3">
          <span style="width:32px;height:32px;border-radius:50%;background:#81D4FA"></span>Leo
        </label>
        <label style="box-sizing:border-box;display:flex;align-items:center;gap:10px;height:44px;padding:0 14px 0 5px;border-radius:999px;background:transparent;border:1px solid rgba(255,240,225,.2);font-size:16px;font-weight:600;line-height:1;color:#C2B8AC;cursor:pointer">
          <input type="checkbox" style="width:20px;height:20px;margin:0;accent-color:#B79CFF;order:3">
          <span style="width:32px;height:32px;border-radius:50%;background:#B39DDB"></span>Grandma &amp; Grandpa
        </label>
      </div>
    </fieldset>

    <div style="margin-top:20px;display:flex;align-items:center;justify-content:flex-end;gap:12px">
      <button type="button" style="box-sizing:border-box;height:44px;padding:0 20px;border-radius:999px;background:transparent;border:1px solid #7A6F64;color:#F3EDE4;font-size:16px;font-weight:600;line-height:1;cursor:pointer">Cancel</button>
      <button type="button" style="box-sizing:border-box;height:44px;padding:0 20px;border-radius:999px;background:#B79CFF;border:0;color:#1B1033;font-size:16px;font-weight:700;line-height:1;cursor:pointer;box-shadow:0 0 0 3px #2E2925,0 0 0 6px #FFF4DD">Add channel</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1200,"height":675}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
